    </div>

    <div class="relative w-full max-w-md">

      <!-- Logo mark -->

  <script src="/auth.min.js"></script>
  <script>
    // ── Google Sign-In ────────────────────────────────────────────────────────
    var GOOGLE_CLIENT_ID = '382209451424-b262nhilchmdaq10oi37r7lq7a12i3qn.apps.googleusercontent.com';

    function handleGoogleCredential(response) {
      googleSignIn(response.credential);
    }

    async function googleSignIn(credential) {
      var errorDiv = document.getElementById('error-msg');
      errorDiv.classList.add('hidden');

      try {
        var apiUrl = (window.AgrosAuth && window.AgrosAuth.api) ? window.AgrosAuth.api : '';
        var res  = await fetch(apiUrl + '/api/auth/google', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ credential })
        });
        var data = await res.json();

        if (!res.ok) {
          errorDiv.textContent = data.error || 'Грешка при вход с Google';
          errorDiv.classList.remove('hidden');
          return;
        }

        window.AgrosAuth.save(data.token, data.user);
        window.location.href = redirectTo;

      } catch {
        errorDiv.textContent = 'Не може да се свърже с сървъра.';
        errorDiv.classList.remove('hidden');
      }
    }

    // Render Google's button once the GSI library is ready
    function initGoogle() {
      if (!window.google) return;
      var container = document.getElementById('google-btn-container');
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback:  handleGoogleCredential,
        ux_mode:   'popup'
      });
      google.accounts.id.renderButton(container, {
        theme:  'outline',
        size:   'large',
        width:  container.offsetWidth || 368,
        locale: 'bg'
      });
    }

    // GSI script uses async — poll until ready
    (function waitForGoogle() {
      if (window.google) { initGoogle(); }
      else { setTimeout(waitForGoogle, 100); }
    }());

    // ── Regular login ─────────────────────────────────────────────────────────
    // Get redirect target from URL param
    var redirectTo = new URLSearchParams(window.location.search).get('redirect') || '/account.html';

    // Show "Continue without account" only when NOT a subscription flow
    (function () {
      var isSubscription = redirectTo.includes('subscription');
      if (!isSubscription) {
        var guestOption = document.getElementById('guest-option');
        var guestLink   = document.getElementById('guest-link');
        var dest = redirectTo.includes('payment') ? redirectTo : '/payment.html';
        dest += (dest.includes('?') ? '&' : '?') + 'guest=true';
        guestLink.href  = dest;
        guestOption.classList.remove('hidden');
      }
    }());

    // Redirect if already logged in
    if (window.AgrosAuth && window.AgrosAuth.getUser()) {
      window.location.href = redirectTo;
    }

    // Toggle password visibility
    document.getElementById('toggle-pw').addEventListener('click', function () {
      const pw   = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        pw.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    });

    // Form submit
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn      = document.getElementById('submit-btn');
      const errorDiv = document.getElementById('error-msg');
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errorDiv.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Зареждане…';

      try {
        var apiUrl = (window.AgrosAuth && window.AgrosAuth.api) ? window.AgrosAuth.api : '';
        const res  = await fetch(apiUrl + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          errorDiv.textContent = data.error || 'Грешка при вход';
          errorDiv.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Влез в акаунта';
          return;
        }

        window.AgrosAuth.save(data.token, data.user);
        window.location.href = redirectTo;

      } catch {
        errorDiv.textContent = 'Грешка при свързване. Опитайте отново.';
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Влез в акаунта';
      }
    });
  </script>
