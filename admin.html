<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGROS Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F0EDE8; color: #1A1A1A; min-height: 100vh; }

  /* ── Header ── */
  .header {
    background: #2F412E;
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .header-logo { display: flex; align-items: center; gap: 12px; }
  .header-logo img { height: 32px; }
  .header-title { color: #B0CAAD; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
  .header-user { display: flex; align-items: center; gap: 10px; color: #B0CAAD; font-size: 13px; }
  .header-user a { color: #B0CAAD; text-decoration: none; font-size: 12px; opacity: 0.7; }
  .header-user a:hover { opacity: 1; }

  /* ── Main layout ── */
  .main { max-width: 1300px; margin: 0 auto; padding: 32px 24px; }

  /* ── Stats ── */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: white;
    border-radius: 14px;
    padding: 20px 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .stat-label { font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; color: #2F412E; font-family: 'Playfair Display', serif; }
  .stat-sub { font-size: 12px; color: #aaa; margin-top: 4px; }

  /* ── Table card ── */
  .table-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  .table-header {
    padding: 20px 24px;
    border-bottom: 1px solid #F0EDE8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .table-header h2 { font-size: 16px; font-weight: 700; color: #2F412E; }
  .search-input {
    padding: 8px 14px;
    border: 1.5px solid #E5E7EB;
    border-radius: 50px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    outline: none;
    width: 240px;
    color: #1A1A1A;
  }
  .search-input:focus { border-color: #416241; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    padding: 10px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    background: #FAFAFA;
    border-bottom: 1px solid #F0EDE8;
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid #F7F5F2;
    cursor: pointer;
    transition: background 0.15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #FAFAF8; }
  tbody td { padding: 14px 16px; font-size: 13px; color: #333; vertical-align: middle; }
  .order-id { font-weight: 700; color: #2F412E; font-size: 13px; }
  .customer-name { font-weight: 600; color: #1A1A1A; }
  .customer-email { font-size: 12px; color: #888; margin-top: 2px; }
  .items-summary { font-size: 12px; color: #666; max-width: 220px; }
  .total { font-weight: 700; color: #2F412E; white-space: nowrap; }
  .date-cell { font-size: 12px; color: #888; white-space: nowrap; }

  /* ── Status badges ── */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 4px 10px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-нова { background: #EFF6FF; color: #2563EB; }
  .badge-в.обработка { background: #FFF7ED; color: #C2410C; }
  .badge-изпратена { background: #F0FDF4; color: #16A34A; }
  .badge-доставена { background: #F0F9FF; color: #0369A1; }
  .badge-default { background: #F4F4F5; color: #71717A; }

  /* ── Modal overlay ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 20px;
    width: 100%;
    max-width: 580px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,0.2);
    animation: modalIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes modalIn { from { opacity:0; transform:scale(0.95) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
  .modal-header {
    padding: 24px 28px 20px;
    border-bottom: 1px solid #F0EDE8;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    background: white;
    border-radius: 20px 20px 0 0;
    z-index: 1;
  }
  .modal-header h3 { font-size: 18px; font-weight: 700; color: #2F412E; }
  .modal-header .modal-subheader { font-size: 12px; color: #999; margin-top: 3px; }
  .modal-close {
    background: none;
    border: none;
    cursor: pointer;
    color: #aaa;
    padding: 4px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: color 0.15s, background 0.15s;
  }
  .modal-close:hover { color: #333; background: rgba(0,0,0,0.06); }
  .modal-body { padding: 24px 28px; }
  .modal-section { margin-bottom: 24px; }
  .modal-section:last-child { margin-bottom: 0; }
  .modal-section-title { font-size: 11px; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
  .detail-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .detail-label { font-size: 13px; color: #888; width: 110px; flex-shrink: 0; }
  .detail-value { font-size: 13px; color: #1A1A1A; font-weight: 500; flex: 1; word-break: break-word; }

  .items-table { width: 100%; border-collapse: collapse; }
  .items-table th { padding: 6px 10px; text-align: left; font-size: 11px; color: #aaa; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid #F0EDE8; }
  .items-table td { padding: 10px 10px; font-size: 13px; border-bottom: 1px solid #F7F5F2; }
  .items-table tr:last-child td { border-bottom: none; }
  .items-table .item-price { text-align: right; font-weight: 600; color: #2F412E; }

  .total-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #F7F3EC; border-radius: 10px; margin-top: 12px; }
  .total-row .total-label { font-size: 14px; font-weight: 600; color: #2F412E; }
  .total-row .total-amount { font-size: 22px; font-weight: 700; color: #2F412E; font-family: 'Playfair Display', serif; }

  .status-select {
    padding: 8px 14px;
    border: 1.5px solid #E5E7EB;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    color: #1A1A1A;
    outline: none;
    cursor: pointer;
  }
  .status-select:focus { border-color: #416241; }
  .btn-save {
    padding: 9px 20px;
    background: #416241;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s;
  }
  .btn-save:hover { background: #507453; }
  .btn-delete {
    padding: 9px 20px;
    background: none;
    color: #c0392b;
    border: 1.5px solid #f5c6c2;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-delete:hover { background: #fff0ef; border-color: #c0392b; }
  .row-delete {
    background: none;
    border: none;
    cursor: pointer;
    color: #ddd;
    padding: 4px 6px;
    border-radius: 6px;
    font-size: 16px;
    line-height: 1;
    transition: color 0.15s, background 0.15s;
  }
  .row-delete:hover { color: #c0392b; background: #fff0ef; }

  /* ── Loading / empty ── */
  .loading { text-align: center; padding: 60px 20px; color: #aaa; font-size: 14px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #E5E7EB; border-top-color: #416241; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 60px 20px; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty p { color: #aaa; font-size: 14px; }

  /* ── Login screen ── */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F0EDE8;
  }
  .login-card {
    background: white;
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.1);
    text-align: center;
  }
  .login-logo { font-family: 'Playfair Display', serif; font-size: 28px; color: #2F412E; margin-bottom: 8px; }
  .login-subtitle { font-size: 13px; color: #aaa; margin-bottom: 32px; }
  .login-input {
    width: 100%;
    padding: 13px 18px;
    border: 1.5px solid #E5E7EB;
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    color: #1A1A1A;
    margin-bottom: 12px;
  }
  .login-input:focus { border-color: #416241; box-shadow: 0 0 0 3px rgba(65,98,65,0.1); }
  .login-btn {
    width: 100%;
    padding: 14px;
    background: #416241;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.15s;
    margin-top: 4px;
  }
  .login-btn:hover { background: #507453; }
  .login-error { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }

  @media (max-width: 768px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .main { padding: 20px 16px; }
    .header { padding: 0 16px; }
  }
</style>
</head>
<body>

<!-- Login screen -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">AGROS</div>
    <div class="login-subtitle">Admin панел</div>
    <input id="login-email" class="login-input" type="email" placeholder="Имейл" value="">
    <input id="login-password" class="login-input" type="password" placeholder="Парола">
    <button class="login-btn" onclick="doLogin()">Влез</button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<!-- Admin panel -->
<div id="admin-panel" style="display:none;">
  <header class="header">
    <div class="header-logo">
      <span style="font-family:'Playfair Display',serif;font-size:20px;color:white;font-weight:700;">AGROS</span>
      <span class="header-title">Admin</span>
    </div>
    <div class="header-user">
      <span id="admin-name"></span>
      <a href="#" onclick="logout()">Изход</a>
    </div>
  </header>

  <main class="main">
    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Общо поръчки</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Нови поръчки</div>
        <div class="stat-value" id="stat-new" style="color:#2563EB;">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Приходи</div>
        <div class="stat-value" id="stat-revenue">—</div>
        <div class="stat-sub" id="stat-revenue-bgn"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Изпратени</div>
        <div class="stat-value" id="stat-shipped" style="color:#16A34A;">—</div>
      </div>
    </div>

    <!-- Orders table -->
    <div class="table-card">
      <div class="table-header">
        <h2>Поръчки</h2>
        <input class="search-input" type="text" placeholder="Търси по клиент, имейл..." oninput="filterOrders(this.value)">
      </div>
      <div id="orders-container">
        <div class="loading"><div class="spinner"></div>Зарежда се...</div>
      </div>
    </div>
  </main>
</div>

<!-- Order detail modal -->
<div class="modal-overlay" id="order-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h3 id="modal-title">Поръчка</h3>
        <div class="modal-subheader" id="modal-subheader"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
  const API = '';
  let token = null;
  let allOrders = [];
  let currentOrder = null;

  // ── Auth ──────────────────────────────────────────────────────────────
  function init() {
    const stored = localStorage.getItem('agros_token');
    const user   = localStorage.getItem('agros_user');
    if (stored && user) {
      const u = JSON.parse(user);
      if (u.email === 'g.berbenkov@agros.net') {
        token = stored;
        showAdmin(u);
        return;
      }
    }
    document.getElementById('login-screen').style.display = 'flex';
  }

  async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    try {
      const res  = await fetch(`${API}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass })
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || 'Грешка при вход'; errEl.style.display = 'block'; return; }
      if (data.user.email !== 'g.berbenkov@agros.net') {
        errEl.textContent = 'Нямате администраторски достъп.'; errEl.style.display = 'block'; return;
      }
      localStorage.setItem('agros_token', data.token);
      localStorage.setItem('agros_user', JSON.stringify(data.user));
      token = data.token;
      showAdmin(data.user);
    } catch(e) {
      errEl.textContent = 'Грешка при свързване.'; errEl.style.display = 'block';
    }
  }

  function showAdmin(user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display  = 'block';
    document.getElementById('admin-name').textContent = user.name || user.email;
    loadOrders();
  }

  function logout() {
    localStorage.removeItem('agros_token');
    localStorage.removeItem('agros_user');
    location.reload();
  }

  // Enter on password field
  document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  // ── Orders ────────────────────────────────────────────────────────────
  async function loadOrders() {
    try {
      const res  = await fetch(`${API}/api/admin/orders`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.status === 403) { alert('Нямате достъп.'); logout(); return; }
      const data = await res.json();
      allOrders = Array.isArray(data) ? data : [];
      renderStats(allOrders);
      renderTable(allOrders);
    } catch(e) {
      document.getElementById('orders-container').innerHTML =
        '<div class="loading">Грешка при зареждане на поръчките.</div>';
    }
  }

  function renderStats(orders) {
    const total    = orders.length;
    const newOrd   = orders.filter(o => o.status === 'нова').length;
    const shipped  = orders.filter(o => o.status === 'изпратена' || o.status === 'доставена').length;
    const revenue  = orders.reduce((s, o) => s + (o.total || 0), 0);

    document.getElementById('stat-total').textContent   = total;
    document.getElementById('stat-new').textContent     = newOrd;
    document.getElementById('stat-shipped').textContent = shipped;
    document.getElementById('stat-revenue').textContent = revenue.toFixed(2) + ' €';
    document.getElementById('stat-revenue-bgn').textContent = '≈ ' + (revenue * 1.9558).toFixed(2) + ' лв.';
  }

  function statusBadge(status) {
    const map = {
      'нова':        'badge-нова',
      'в обработка': 'badge-в.обработка',
      'изпратена':   'badge-изпратена',
      'доставена':   'badge-доставена',
    };
    const cls = map[status] || 'badge-default';
    return `<span class="badge ${cls}">${status || 'нова'}</span>`;
  }

  function formatDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('bg-BG', { day: '2-digit', month: '2-digit', year: 'numeric' })
      + ' ' + d.toLocaleTimeString('bg-BG', { hour: '2-digit', minute: '2-digit' });
  }

  function renderTable(orders) {
    const container = document.getElementById('orders-container');
    if (orders.length === 0) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">📦</div><p>Няма поръчки</p></div>';
      return;
    }

    const rows = orders.map(o => {
      const c = o.customer || {};
      const itemsSummary = (o.items || []).map(i => `${i.name}${i.size ? ' ' + i.size : ''} ×${i.qty}`).join(', ');
      const id = esc(String(o.id));
      return `
        <tr onclick="openOrderById('${id}')">
          <td><span class="order-id">#${o.id}</span></td>
          <td>
            <div class="customer-name">${esc(c.name || '—')}</div>
            <div class="customer-email">${esc(c.email || (o.guestEmail ? o.guestEmail + ' (гост)' : '—'))}</div>
          </td>
          <td><div class="items-summary">${esc(itemsSummary)}</div></td>
          <td><span class="total">${(o.total || 0).toFixed(2)} €</span></td>
          <td>${statusBadge(o.status)}</td>
          <td><span class="date-cell">${formatDate(o.createdAt)}</span></td>
          <td onclick="event.stopPropagation()">
            <button class="row-delete" onclick="deleteOrderById('${id}')" title="Изтрий">✕</button>
          </td>
        </tr>`;
    }).join('');

    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Поръчка</th>
            <th>Клиент</th>
            <th>Продукти</th>
            <th>Сума</th>
            <th>Статус</th>
            <th>Дата</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function filterOrders(q) {
    const lower = q.toLowerCase();
    const filtered = allOrders.filter(o => {
      const c = o.customer || {};
      return !q
        || (c.name  || '').toLowerCase().includes(lower)
        || (c.email || '').toLowerCase().includes(lower)
        || (o.guestEmail || '').toLowerCase().includes(lower)
        || String(o.id).includes(lower)
        || (c.phone || '').includes(lower);
    });
    renderTable(filtered);
  }

  // ── Order modal ───────────────────────────────────────────────────────
  function openOrderById(id) {
    const order = allOrders.find(o => String(o.id) === String(id));
    if (order) openOrder(order);
  }

  function openOrder(order) {
    currentOrder = order;
    const o = currentOrder;
    const c = o.customer || {};

    document.getElementById('modal-title').textContent = `Поръчка #${o.id}`;
    document.getElementById('modal-subheader').textContent = formatDate(o.createdAt) + (o.userId ? '' : ' · Гост');

    const itemsRows = (o.items || []).map(i => `
      <tr>
        <td>${esc(i.name)}${i.size ? ' <span style="color:#aaa;font-size:12px;">' + esc(i.size) + '</span>' : ''}</td>
        <td style="text-align:center;color:#666;">×${i.qty}</td>
        <td class="item-price">${(i.price * i.qty).toFixed(2)} €</td>
      </tr>`).join('');

    document.getElementById('modal-body').innerHTML = `
      <div class="modal-section">
        <div class="modal-section-title">Клиент</div>
        <div class="detail-row"><span class="detail-label">Имена</span><span class="detail-value">${esc(c.name || '—')}</span></div>
        <div class="detail-row"><span class="detail-label">Телефон</span><span class="detail-value">${esc(c.phone || '—')}</span></div>
        <div class="detail-row"><span class="detail-label">Имейл</span><span class="detail-value">${esc(c.email || o.guestEmail || '—')}</span></div>
        <div class="detail-row"><span class="detail-label">Адрес</span><span class="detail-value">${esc(c.address || '—')}</span></div>
        ${c.city ? `<div class="detail-row"><span class="detail-label">Град</span><span class="detail-value">${esc(c.city)}</span></div>` : ''}
        ${c.note ? `<div class="detail-row"><span class="detail-label">Бележка</span><span class="detail-value">${esc(c.note)}</span></div>` : ''}
      </div>

      <div class="modal-section">
        <div class="modal-section-title">Продукти</div>
        <table class="items-table">
          <thead><tr><th>Продукт</th><th style="text-align:center;">Кол.</th><th style="text-align:right;">Сума</th></tr></thead>
          <tbody>${itemsRows}</tbody>
        </table>
        <div class="total-row">
          <span class="total-label">Общо</span>
          <span class="total-amount">${(o.total || 0).toFixed(2)} €</span>
        </div>
      </div>

      ${o.paymentIntentId ? `
      <div class="modal-section">
        <div class="modal-section-title">Плащане</div>
        <div class="detail-row"><span class="detail-label">Payment ID</span><span class="detail-value" style="font-size:11px;word-break:break-all;color:#888;">${esc(o.paymentIntentId)}</span></div>
      </div>` : ''}

      <div class="modal-section">
        <div class="modal-section-title">Статус на поръчката</div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <select class="status-select" id="status-select">
            ${['нова','в обработка','изпратена','доставена'].map(s =>
              `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s}</option>`
            ).join('')}
          </select>
          <button class="btn-save" onclick="saveStatus()">Запази</button>
          <span id="status-msg" style="font-size:12px;color:#16A34A;display:none;">✓ Запазено</span>
          <button class="btn-delete" onclick="deleteOrder(currentOrder)" style="margin-left:auto;">Изтрий поръчката</button>
        </div>
      </div>`;

    document.getElementById('order-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('order-modal').classList.remove('open');
    currentOrder = null;
  }

  async function saveStatus() {
    if (!currentOrder) return;
    const newStatus = document.getElementById('status-select').value;
    try {
      const res = await fetch(`${API}/api/admin/orders`, {
        method: 'PATCH',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ order: currentOrder, status: newStatus })
      });
      if (!res.ok) throw new Error();
      // Update local data
      const idx = allOrders.findIndex(o => String(o.id) === String(currentOrder.id));
      if (idx !== -1) { allOrders[idx].status = newStatus; currentOrder.status = newStatus; }
      renderStats(allOrders);
      renderTable(allOrders);
      const msg = document.getElementById('status-msg');
      msg.style.display = 'inline';
      setTimeout(() => { msg.style.display = 'none'; }, 2000);
    } catch(e) {
      alert('Грешка при запазване на статуса.');
    }
  }

  function deleteOrderById(id) {
    const order = allOrders.find(o => String(o.id) === String(id));
    if (order) deleteOrder(order);
  }

  async function deleteOrder(order) {
    if (!confirm(`Изтриване на поръчка #${order.id}?`)) return;
    try {
      const res = await fetch(`${API}/api/admin/orders`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ order })
      });
      if (!res.ok) throw new Error();
      allOrders = allOrders.filter(o => String(o.id) !== String(order.id));
      renderStats(allOrders);
      renderTable(allOrders);
      closeModal();
    } catch(e) {
      alert('Грешка при изтриване.');
    }
  }

  // ── Utils ─────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Start ─────────────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
